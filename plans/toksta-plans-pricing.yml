note: >-
  Toksta publishes TWO distinct plan ladders. A SaaS ladder (Free / PAYG / Starter /
  Pro / Agency) sold on the marketing site, where API and MCP access are a feature of
  the paid tiers, and a separate DEDICATED API ladder (API PAYG / Build / Scale /
  Enterprise) sold in-app at hub.toksta.com/api-pricing. The dedicated ladder is
  data-only: workspace endpoints (/v1/campaigns, /v1/creator-lists) return 403 on it.
  Everything below is quoted from the provider's own published tables.
billing_model:
  unit: credit
  metering: per operation
  subscription_credits: Reset each billing cycle.
  purchased_credits: PAYG top-up credits never expire.
  consumption_order: Monthly subscription credits are consumed before purchased credits.
  minimum_topup_usd: 10
  overage: Charged at the plan's per-credit overage rate once included credits are exhausted.
  exhaustion_response: 'HTTP 402 with error.code = INSUFFICIENT_CREDITS'
  cost_header: X-Toksta-Credit-Cost
  cost_header_note: Billable responses may include this header carrying the credit cost of that operation.
