    post:
      operationId: createCreatorList
      summary: Create a creator list
      tags:
      - Creator Lists
      description: Create a creator list. **SaaS workspace entitlement required** — dedicated API keys receive `403`. `name` is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  description: List name (required).
                description:
                  type: string
                is_private:
                  type: boolean
                  description: Defaults to true.
                tags:
                  type: array
                  items:
                    type: string
                platform:
                  type: string
                  enum:
                  - linkedin
                  - youtube
                  - twitter
                  description: Optional platform.
                public_creator_ids:
                  type: array
                  items:
                    type: string
                    description: UUID v4 string.
                  description: Public creator UUIDs to seed the list.
                private_creator_ids:
                  type: array
                  items:
                    type: string
                    description: UUID v4 string.
                  description: Private creator UUIDs to seed the list.
              example:
                name: Shortlist — Dev influencers
                platform: linkedin
                is_private: true
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Creator list created.
          content:
            application/json:
              schema:
                type: object
                description: Creator list created.
                required:
                - success
                - data
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: true
                    description: Operation payload. See the example for the exact field structure.
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
                example:
                  success: true
                  data:
                    creator_list:
                      id: 11112222-3333-4444-5555-666677778888
                      name: Shortlist — Dev influencers
                      description: null
                      is_private: true
                      tags: []
                      platform: linkedin
                      creator_counts:
                        public_creators: 0
                        private_creators: 0
                        total: 0
                      created_at: '2026-05-29T10:00:00Z'
                      updated_at: '2026-05-29T10:00:00Z'
                  meta:
                    request_id: req_01HXYZ...
                    trace_id: 4f1d...c2
