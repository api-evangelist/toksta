openapi: 3.2.0
info:
  title: Toksta Public Creator Lists API
  description: Public API for Toksta creator data, analysis jobs, and SaaS workspace workflows.
  version: 0.1.0
servers:
- url: https://api.toksta.com
tags:
- name: Creator Lists
paths:
  /v1/creator-lists:
    get:
      operationId: listCreatorLists
      summary: List creator lists
      tags:
      - Creator Lists
      description: List creator lists owned by the key's user. **SaaS workspace entitlement required** — dedicated API keys receive an empty list.
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
        description: Page size (1-100). Defaults to 50.
      - schema:
          type: integer
          minimum: 0
        in: query
        name: offset
        required: false
        description: Result offset. Defaults to 0.
      - schema:
          type: string
        in: query
        name: platform
        required: false
        description: Optional platform filter.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Creator list collection (paginated via `meta`).
          content:
            application/json:
              schema:
                type: object
                description: Creator list collection (paginated via `meta`).
                required:
                - success
                - data
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: true
                    description: Operation payload. See the example for the exact field structure.
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
                example:
                  success: true
                  data:
