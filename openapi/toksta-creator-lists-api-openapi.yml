  /v1/creator-lists/{id}/creators:
    post:
      operationId: saveCreatorsToList
      summary: Save creators to a list
      tags:
      - Creator Lists
      description: Add creators to an existing creator list. **SaaS workspace entitlement required.** The `{id}` path parameter must be the list UUID. This endpoint only saves to an existing list — create one first with `POST /v1/creator-lists`. `creator_ids` (≥1 valid UUID, max 100) is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - creator_ids
              properties:
                creator_ids:
                  type: array
                  items:
                    type: string
                    description: UUID v4 string.
                  minItems: 1
                  maxItems: 100
                  description: Creator UUIDs to add (1-100).
                creator_source:
                  type: string
                  enum:
                  - public
                  - private
                  description: Whether IDs are public or private creators. Defaults to `public`.
              example:
                creator_ids:
                - f0e1d2c3-b4a5-4678-9abc-def012345678
                creator_source: public
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Creator list UUID.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Creators saved to the list.
          content:
            application/json:
              schema:
                type: object
                description: Creators saved to the list.
                required:
                - success
                - data
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: true
                    description: Operation payload. See the example for the exact field structure.
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
                example:
                  success: true
                  data:
                    list_id: 11112222-3333-4444-5555-666677778888
                    creator_source: public
                    requested_count: 1
                    added_count: 1
                    total_items: 1
