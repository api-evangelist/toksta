openapi: 3.2.0
info:
  title: Toksta Public Creators API
  description: Public API for Toksta creator data, analysis jobs, and SaaS workspace workflows.
  version: 0.1.0
servers:
- url: https://api.toksta.com
tags:
- name: Creators
paths:
  /v1/creators/search:
    post:
      operationId: searchCreators
      summary: Search public creators
      tags:
      - Creators
      description: Keyword/filter search over the public creator database. Returns a single page of creators with cursor pagination.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                query:
                  type: string
                  description: Free-text search matched against creator name and bio.
                platform:
                  type: string
                  enum:
                  - linkedin
                  - youtube
                  description: Creator platform. Defaults to `linkedin`.
                filters:
                  type: object
                  additionalProperties: true
                  description: Optional structured filters applied to the candidate set.
                  properties:
                    content_categories:
                      type: array
                      items:
                        type: string
                    target_audiences:
                      type: array
                      items:
                        type: string
                    languages:
                      type: array
                      items:
                        type: string
                    locations:
                      type: array
                      items:
                        type: string
                    hide_brands:
                      type: boolean
                    min_followers:
                      type: number
                    max_followers:
                      type: number
                    min_engagement:
                      type: number
                    max_engagement:
                      type: number
                    min_posts_per_month:
                      type: number
                    max_posts_per_month:
                      type: number
                    min_reactions_per_post:
                      type: number
                    max_reactions_per_post:
                      type: number
                    min_comments_per_post:
                      type: number
                    max_comments_per_post:
                      type: number
                    min_shares_per_post:
                      type: number
                    max_shares_per_post:
                      type: number
                cursor:
                  type: string
                  description: Pagination cursor from the previous response's `meta.next_cursor`.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Page size (1-100). Defaults to 50.
                sort_by:
                  type: string
                  enum:
                  - followers_count
                  - engagement_rate
                  - avg_posts_per_month
                  - avg_views_per_post
                  - shares_per_post
                  - comments_per_post
                  - reactions_per_post
                  - name
                  - updated_at
                  description: Field to sort by. Defaults to `followers_count`.
                sort_order:
                  type: string
                  enum:
                  - asc
                  - desc
                  description: Sort direction. Defaults to `desc`.
              example:
                platform: linkedin
                query: growth marketing
                limit: 25
                filters:
                  min_followers: 5000
                  hide_brands: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Creator search results.
          content:
            application/json:
              schema:
                type: object
                description: Creator search results.
                required:
                - success
                - data
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: true
                    description: Operation payload. See the example for the exact field structure.
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
                example:
                  success: true
                  data:
                    creators:
                    - id: f0e1d2c3-b4a5-4678-9abc-def012345678
                      name: Jane Marketer
                      bio: Head of Growth. I write about B2B SaaS and demand gen.
                      location: London, UK
                      avatar_url: https://media.licdn.com/.../jane.jpg
                      content_categories:
                      - marketing
                      - saas
                      target_audiences:
                      - marketers
                      - founders
                      languages:
                      - en
                      platform: linkedin
                      handle: jane-marketer
                      profile_url: https://www.linkedin.com/in/jane-marketer/
                      metrics:
