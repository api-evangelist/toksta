                      type: number
                    min_engagement:
                      type: number
                    max_engagement:
                      type: number
                    min_posts_per_month:
                      type: number
                    max_posts_per_month:
                      type: number
                    min_reactions_per_post:
                      type: number
                    max_reactions_per_post:
                      type: number
                    min_comments_per_post:
                      type: number
                    max_comments_per_post:
                      type: number
                    min_shares_per_post:
                      type: number
                    max_shares_per_post:
                      type: number
              example:
                platform: linkedin
                keywords:
                - SaaS
                - marketing
                - growth
                limit: 5
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Ranked discovery results. `meta` includes `keywords_used`, `ranking_source`, `search_mode`, and pagination.
          content:
            application/json:
              schema:
                type: object
                description: Ranked discovery results. `meta` includes `keywords_used`, `ranking_source`, `search_mode`, and pagination.
                required:
                - success
                - data
                - meta
                properties:
