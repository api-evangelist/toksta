  /v1/creators/thought-leaders:
    post:
      operationId: findThoughtLeaders
      summary: Find thought leaders for a topic
      tags:
      - Creators
      description: 'Start an async thought leaders job for a topic. Requires at least 5 keywords. Runs discovery, enrichment refresh, and recent-post content validation. Poll `GET /v1/jobs/{job_id}` and fetch results via `POST /v1/jobs/results` when status is terminal. Credits are reserved up front from `max_candidates_to_analyze` and mode (broad: 1, balanced: 2, strict: 3 credits per creator analyzed); unused credits are refunded after completion.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - keywords
              properties:
                keywords:
                  type: array
                  items:
                    type: string
                  minItems: 5
                  description: Topic keywords. REQUIRED and must contain at least 5 strings.
                count:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Max thought leaders to return. Defaults to 10.
                min_followers:
                  type: number
                  minimum: 0
                  description: Minimum follower count. Defaults to 30000.
                min_reactions_per_post:
                  type: number
                  minimum: 0
                  description: Minimum average reactions per post. Defaults to 50.
                min_content_match_score:
                  type: number
                  minimum: 0
                  description: Minimum content match score (0-100). Defaults to 60.
                hide_brands:
                  type: boolean
                  description: Exclude brand/company pages. Defaults to true.
                mode:
                  type: string
                  enum:
                  - strict
                  - balanced
                  - broad
                  description: Ranking strictness. Defaults to `balanced`.
                location:
                  type: string
                  description: Single location filter.
                language:
                  type: string
                  description: Single language filter.
                posts_to_analyze:
                  type: integer
                  enum:
                  - 10
                  - 20
                  - 30
                  description: Posts analyzed per candidate. One of 10, 20, 30. Defaults to 10.
                max_candidates_to_analyze:
                  type: integer
                  minimum: 1
                  maximum: 200
                  description: Cap on candidates analyzed. Defaults to 100.
                filters:
                  type: object
                  additionalProperties: true
                  description: Optional structured filters applied to the candidate set.
                  properties:
                    content_categories:
                      type: array
                      items:
                        type: string
                    target_audiences:
                      type: array
                      items:
                        type: string
                    languages:
                      type: array
                      items:
                        type: string
                    locations:
                      type: array
                      items:
                        type: string
                    hide_brands:
                      type: boolean
                    min_followers:
                      type: number
                    max_followers:
                      type: number
                    min_engagement:
                      type: number
                    max_engagement:
                      type: number
                    min_posts_per_month:
                      type: number
                    max_posts_per_month:
                      type: number
                    min_reactions_per_post:
                      type: number
                    max_reactions_per_post:
                      type: number
                    min_comments_per_post:
                      type: number
                    max_comments_per_post:
                      type: number
                    min_shares_per_post:
                      type: number
                    max_shares_per_post:
                      type: number
              example:
                keywords:
                - B2B SaaS
                - demand generation
                - marketing analytics
                - growth
                - ABM
                count: 10
                min_followers: 30000
                mode: balanced
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Job accepted. Poll job status and results endpoints until terminal.
          content:
            application/json:
              schema:
                type: object
                description: Job accepted. Poll job status and results endpoints until terminal.
                required:
                - success
                - data
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: true
                    description: Operation payload. See the example for the exact field structure.
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
                example:
                  success: true
                  data:
                    job_id: a1b2c3d4-e5f6-4789-a012-3456789abcde
                    job_type: thought_leaders
                    status: queued
                  meta:
                    request_id: req_01HXYZ...
                    trace_id: 4f1d...c2
        '400':
          description: Bad request or validation error (`BAD_REQUEST` / `VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - error
                - meta
                properties:
                  success:
                    type: boolean
