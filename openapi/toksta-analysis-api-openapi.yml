  /v1/creators/audience-match:
    post:
      operationId: startAudienceMatch
      summary: Start audience match analysis
      tags:
      - Analysis
      description: 'Start LinkedIn audience-fit analysis for a creator selection. Requires a user-scoped key.


        **Selection (provide exactly one):** `creator_ids`, `result_set_id`, or `result_set_ids`.


        **Audience criteria:** for ad hoc runs (no `campaign_id`) provide at least one of `campaign_brief`, `target_audience`, `audience_keywords` (array), or `target_audience_criteria` (array). When `campaign_id` is set, criteria are read from the campaign.


        Returns `202` with **prefixed** job IDs in the form `audience-fit:`. Use those IDs with `POST /v1/audience-match/results` or `/details`. Cost: 10/20/30 credits per analysis based on `analysis_depth`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                creator_ids:
                  type: array
                  items:
                    type: string
                    description: UUID v4 string.
                  description: Creator UUIDs to operate on. Takes precedence over result_set_id / result_set_ids when provided.
                result_set_id:
                  type: string
                  description: A single `result_set_id` returned by a prior discovery search. Resolved to its ranked creators.
                result_set_ids:
                  type: array
                  items:
                    type: string
                  description: Multiple result set IDs to merge (dedupe) into one creator selection.
                top_n:
                  type: integer
                  minimum: 1
                  description: When selecting from result set(s), take only the top N ranked creators.
                ranks:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  description: When a single result_set_id is provided, select specific 1-based ranks (e.g. [1,3,5]).
                campaign_id:
                  type: string
                  description: Optional campaign UUID. When set, audience criteria come from the campaign.
                campaign_brief:
                  type: string
                  description: Free-text brief describing the target audience (ad hoc).
                target_audience:
                  type: string
                  description: Alias for campaign_brief (ad hoc).
                audience_keywords:
                  type: array
                  items:
                    type: string
                  description: 'Audience keywords (ad hoc). Alias: `keywords`.'
                target_audience_criteria:
                  type: array
                  items:
                    type: string
                  description: Free-form audience criteria strings (e.g. job titles, seniorities, industries) for ad hoc runs.
                analysis_depth:
                  type: string
                  enum:
                  - quick_scan
                  - deep_dive
                  - comprehensive
                  description: Analysis depth. quick_scan (10cr), deep_dive (20cr), comprehensive (30cr). Defaults to quick_scan.
              example:
                creator_ids:
                - f0e1d2c3-b4a5-4678-9abc-def012345678
                target_audience_criteria:
                - VP Marketing
                - Head of Growth
                - B2B SaaS
                analysis_depth: quick_scan
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Audience match jobs queued. Job IDs are prefixed `audience-fit:<uuid>`.
          content:
            application/json:
              schema:
                type: object
                description: Audience match jobs queued. Job IDs are prefixed `audience-fit:<uuid>`.
                required:
                - success
                - data
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: true
                    description: Operation payload. See the example for the exact field structure.
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
                example:
                  success: true
                  data:
                    creators_requested: 1
                    selection:
                      source: creator_ids
                      selected_count: 1
                    campaign_id: null
                    analysis_depth: quick_scan
                    jobs_created: 1
                    job_ids:
                    - audience-fit:a5f1eeb5-ee98-41bc-8b2c-3d4e5f6a7b8c
                    jobs:
                    - creator_id: f0e1d2c3-b4a5-4678-9abc-def012345678
                      analysis_id: a5f1eeb5-ee98-41bc-8b2c-3d4e5f6a7b8c
                      job_id: audience-fit:a5f1eeb5-ee98-41bc-8b2c-3d4e5f6a7b8c
                      status: pending
                      cached: false
                      message: Audience analysis started. This may take a few minutes.
                      creator_name: Jane Marketer
                      profile_url: https://www.linkedin.com/in/jane-marketer/
                    failures: []
                  meta:
                    request_id: req_01HXYZ...
                    trace_id: 4f1d...c2
        '400':
          description: Bad request or validation error (`BAD_REQUEST` / `VALIDATION_ERROR`).
