  /v1/content-match/results:
    post:
      operationId: getContentMatchResults
      summary: Get content match results
      tags:
      - Analysis
      description: 'Fetch content-match analysis results.


        **Two selection modes:**

        1. By job: `job_id` (string) or `job_ids` (array). Accepts the prefixed form `content-fit:` or the bare analysis UUID.

        2. By creators: `creator_ids`/`result_set_id`/`result_set_ids` (optionally with `campaign_id`) to fetch the latest saved analysis per creator.


        `detail_level: "full"` adds the `results` array. Use `wait_seconds` to poll inline.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                job_id:
                  type: string
                  description: A single content-match job ID (`content-fit:<uuid>` or bare UUID).
                job_ids:
                  type: array
                  items:
                    type: string
                  description: Multiple content-match job IDs.
                creator_ids:
                  type: array
                  items:
                    type: string
                    description: UUID v4 string.
                  description: Creator UUIDs to operate on. Takes precedence over result_set_id / result_set_ids when provided.
                result_set_id:
                  type: string
                  description: A single `result_set_id` returned by a prior discovery search. Resolved to its ranked creators.
                result_set_ids:
                  type: array
                  items:
                    type: string
                  description: Multiple result set IDs to merge (dedupe) into one creator selection.
                top_n:
                  type: integer
                  minimum: 1
                  description: When selecting from result set(s), take only the top N ranked creators.
                ranks:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  description: When a single result_set_id is provided, select specific 1-based ranks (e.g. [1,3,5]).
                campaign_id:
                  type: string
                  description: Optional campaign UUID to scope creator-based lookups.
                detail_level:
                  type: string
                  enum:
                  - summary
                  - full
                  description: Response verbosity. `summary` (default) returns trimmed fields; `full` returns the complete records.
                wait_seconds:
                  type: integer
                  minimum: 0
                  maximum: 30
                  description: Optional inline poll. Holds the request up to this many seconds (max 30) waiting for jobs to reach a terminal state before returning. Defaults to 0 (return immediately).
              example:
                job_id: content-fit:56232ac2-8068-4dcb-9d1a-1f2e3a4b5c6d
                detail_level: summary
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Content-match results. Job-selector mode returns selection/found_count; creator mode returns creators_requested/missing_creator_ids.
          content:
            application/json:
              schema:
                type: object
                description: Content-match results. Job-selector mode returns selection/found_count; creator mode returns creators_requested/missing_creator_ids.
                required:
                - success
                - data
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: true
                    description: Operation payload. See the example for the exact field structure.
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
                example:
                  success: true
                  data:
                    selection:
                      source: job_id
                      selected_count: 1
                    requested_count: 1
                    found_count: 1
                    not_found_ids: []
                    expired_ids: []
                    results_summary:
                    - job_id: content-fit:56232ac2-8068-4dcb-9d1a-1f2e3a4b5c6d
                      analysis_id: 56232ac2-8068-4dcb-9d1a-1f2e3a4b5c6d
                      creator_id: f0e1d2c3-b4a5-4678-9abc-def012345678
                      creator_name: Jane Marketer
                      profile_url: https://www.linkedin.com/in/jane-marketer/
                      platform: linkedin
                      status: succeeded
                      source_status: completed
                      match_score: 78
                      matching_posts_count: 6
                      total_posts_analyzed: 10
                      content_fit_label: Strong fit
                      matched_posts_status: saved_snippets_available
                      recommended_next_endpoint: /v1/content-match/posts
                      error_message: null
                      completed_at: '2026-05-28T09:06:00Z'
                      updated_at: '2026-05-28T09:06:00Z'
