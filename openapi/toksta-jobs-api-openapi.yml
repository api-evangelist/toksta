  /v1/jobs/results:
    post:
      operationId: getJobResults
      summary: Get one job result
      tags:
      - Jobs
      description: Fetch the full result of one creator-discovery job. `job_id` must be a **plain UUID** (not prefixed). Use `limit` (alias `results_limit`, max 200) to cap the number of candidate rows returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - job_id
              properties:
                job_id:
                  type: string
                  description: Discovery job UUID (plain, unprefixed). REQUIRED.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 200
                  description: 'Max candidate rows (1-200). Defaults to 50. Alias: results_limit.'
              example:
                job_id: 56232ac2-8068-4dcb-9d1a-1f2e3a4b5c6d
                limit: 50
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Single discovery job result with candidate rows.
          content:
            application/json:
              schema:
                type: object
                description: Single discovery job result with candidate rows.
                required:
                - success
