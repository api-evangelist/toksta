  /v1/jobs/results{bulk}:
    post:
      operationId: getBulkJobResults
      summary: Get multiple job results
      tags:
      - Jobs
      description: 'Fetch results for multiple creator-discovery jobs in one call.


        **URL:** `POST /v1/jobs/results:bulk` (note the `:bulk` action suffix).


        Body requires `job_ids`: an array of 1-20 **plain UUIDs** (not prefixed). Each entry in the response carries `found` plus the job result or a per-job error.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - job_ids
              properties:
                job_ids:
                  type: array
                  items:
                    type: string
                    description: UUID v4 string.
                  minItems: 1
                  maxItems: 20
                  description: 1-20 discovery job UUIDs (plain, unprefixed). REQUIRED.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 200
                  description: 'Max candidate rows per job (1-200). Defaults to 50. Alias: results_limit.'
              example:
                job_ids:
                - 56232ac2-8068-4dcb-9d1a-1f2e3a4b5c6d
                - 7a8b9c0d-1e2f-4a3b-8c9d-0e1f2a3b4c5d
                limit: 25
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
        in: path
        name: bulk
        required: true
      responses:
        '200':
          description: Bulk job results. `meta` includes requested_count, found_count, not_found_count.
          content:
            application/json:
              schema:
                type: object
                description: Bulk job results. `meta` includes requested_count, found_count, not_found_count.
                required:
                - success
                - data
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: true
                    description: Operation payload. See the example for the exact field structure.
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
                example:
                  success: true
                  data:
                    jobs:
                    - found: true
                      job_id: 56232ac2-8068-4dcb-9d1a-1f2e3a4b5c6d
                      job_type: creator_discovery
                      status: succeeded
                      progress:
                        total_items: 120
                        completed_items: 120
                        approved_items: 38
                        failed_items: 82
                      result_count: 38
                      results: []
                    - job_id: 7a8b9c0d-1e2f-4a3b-8c9d-0e1f2a3b4c5d
                      found: false
                  meta:
                    request_id: req_01HXYZ...
                    trace_id: 4f1d...c2
        '400':
