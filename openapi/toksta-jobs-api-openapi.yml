      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Job UUID (plain, unprefixed).
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Job status. `status` is one of queued, running, succeeded, failed, canceled, expired.
          content:
            application/json:
              schema:
                type: object
                description: Job status. `status` is one of queued, running, succeeded, failed, canceled, expired.
