                  data:
                    type: object
                    additionalProperties: true
                    description: Operation payload. See the example for the exact field structure.
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
                example:
                  success: true
                  data:
                    job:
                      id: 56232ac2-8068-4dcb-9d1a-1f2e3a4b5c6d
                      job_type: creator_discovery
                      status: succeeded
                      source_status: completed
                      is_terminal: true
