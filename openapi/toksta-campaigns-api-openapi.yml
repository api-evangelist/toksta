openapi: 3.2.0
info:
  title: Toksta Public Campaigns API
  description: Public API for Toksta creator data, analysis jobs, and SaaS workspace workflows.
  version: 0.1.0
servers:
- url: https://api.toksta.com
tags:
- name: Campaigns
paths:
  /v1/campaigns:
    get:
      operationId: listCampaigns
      summary: List campaigns
      tags:
      - Campaigns
      description: List campaigns owned by the key's user. **SaaS workspace entitlement required** — dedicated API keys receive an empty list.
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
        description: Page size (1-100). Defaults to 50.
      - schema:
          type: integer
          minimum: 0
        in: query
        name: offset
        required: false
        description: Result offset. Defaults to 0.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Campaign list (paginated via `meta`).
          content:
            application/json:
              schema:
                type: object
                description: Campaign list (paginated via `meta`).
                required:
                - success
                - data
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: true
                    description: Operation payload. See the example for the exact field structure.
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
                example:
                  success: true
                  data:
                    campaigns: []
                  meta:
                    request_id: req_01HXYZ...
                    trace_id: 4f1d...c2
