    post:
      operationId: createCampaign
      summary: Create a campaign
      tags:
      - Campaigns
      description: 'Create a campaign. **SaaS workspace entitlement required** — dedicated API keys receive `403`.


        `name`, `content_keywords` (≥1), and `target_audience_criteria` (≥1) are required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - name
              - content_keywords
              - target_audience_criteria
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Campaign name (required).
                content_keywords:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Content keywords (at least one required).
                target_audience_criteria:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Audience criteria (at least one required).
                product_id:
                  type: string
                  description: Optional product UUID.
                product_name:
                  type: string
                target_regions:
                  type: array
                  items:
                    type: string
                target_audience:
                  type: string
                target_job_titles:
                  type: array
                  items:
                    type: string
                target_platforms:
                  type: array
                  items:
                    type: string
                target_companies:
                  type: array
                  items:
                    type: string
                creator_regions:
                  type: array
                  items:
                    type: string
                search_country:
                  type: string
                  description: ISO country code. Defaults to `us`.
                linkedin_content_types:
                  type: array
                  items:
                    type: string
                    enum:
                    - image
                    - video
                    - carousel
                min_linkedin_followers:
                  type: number
                  minimum: 0
                max_linkedin_followers:
                  type: number
                  minimum: 0
                min_youtube_subscribers:
                  type: number
                  minimum: 0
                max_youtube_subscribers:
                  type: number
                  minimum: 0
                min_youtube_monthly_views:
                  type: number
                  minimum: 0
                max_youtube_monthly_views:
                  type: number
                  minimum: 0
              example:
                name: Q3 Developer Launch
                content_keywords:
                - developer tools
                - API
                target_audience_criteria:
                - CTO
                - VP Engineering
                target_platforms:
                - linkedin
                search_country: us
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Campaign created.
          content:
            application/json:
              schema:
                type: object
                description: Campaign created.
                required:
                - success
                - data
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: true
                    description: Operation payload. See the example for the exact field structure.
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
                example:
