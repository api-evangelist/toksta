    post:
      operationId: createCampaign
      summary: Create a campaign
      tags:
      - Campaigns
      description: 'Create a campaign. **SaaS workspace entitlement required** — dedicated API keys receive `403`.


        `name`, `content_keywords` (≥1), and `target_audience_criteria` (≥1) are required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - name
              - content_keywords
              - target_audience_criteria
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Campaign name (required).
                content_keywords:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Content keywords (at least one required).
                target_audience_criteria:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Audience criteria (at least one required).
                product_id:
                  type: string
                  description: Optional product UUID.
                product_name:
                  type: string
                target_regions:
                  type: array
                  items:
                    type: string
                target_audience:
                  type: string
                target_job_titles:
                  type: array
                  items:
                    type: string
                target_platforms:
                  type: array
                  items:
                    type: string
                target_companies:
                  type: array
                  items:
                    type: string
                creator_regions:
                  type: array
                  items:
                    type: string
                search_country:
                  type: string
