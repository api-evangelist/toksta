                job_ids:
                  type: array
                  items:
                    type: string
                creator_ids:
                  type: array
                  items:
                    type: string
                    description: UUID v4 string.
                  description: Creator UUIDs to operate on. Takes precedence over result_set_id / result_set_ids when provided.
                result_set_id:
                  type: string
                  description: A single `result_set_id` returned by a prior discovery search. Resolved to its ranked creators.
                result_set_ids:
                  type: array
                  items:
                    type: string
                  description: Multiple result set IDs to merge (dedupe) into one creator selection.
                top_n:
                  type: integer
                  minimum: 1
                  description: When selecting from result set(s), take only the top N ranked creators.
                ranks:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  description: When a single result_set_id is provided, select specific 1-based ranks (e.g. [1,3,5]).
                campaign_id:
                  type: string
                  description: Optional campaign UUID to scope creator-based lookups.
                engagers_limit:
                  type: integer
                  minimum: 1
                  maximum: 30
                  description: Top engagers to return (1-30). Defaults to 5.
                detail_level:
                  type: string
                  enum:
                  - summary
                  - full
                  description: Response verbosity. `summary` (default) returns trimmed fields; `full` returns the complete
                    records.
                wait_seconds:
                  type: integer
                  minimum: 0
                  maximum: 30
                  description: Optional inline poll. Holds the request up to this many seconds (max 30) waiting for jobs to
                    reach a terminal state before returning. Defaults to 0 (return immediately).
