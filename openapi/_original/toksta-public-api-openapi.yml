  /v1/enrichments/results:
    post:
      operationId: getEnrichmentResults
      summary: Get enrichment results
      tags:
      - Enrichment
      description: 'Fetch enrichment results for a creator selection.


        **Selection (provide one):** `creator_ids` (array of UUIDs), `result_set_id`, or `result_set_ids`. Because enrichment
        can complete synchronously (no job IDs), `creator_ids` is the reliable way to retrieve results. Set `detail_level:
        "full"` to include the `results` array with extended fields. Use `wait_seconds` to poll inline.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                creator_ids:
                  type: array
                  items:
