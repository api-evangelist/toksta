  /v1/creators/enrich:
    post:
      operationId: startCreatorEnrichment
      summary: Start creator enrichment
      tags:
      - Enrichment
      description: 'Start LinkedIn profile enrichment for a creator selection. Requires a user-scoped key.


        **Selection (provide exactly one):** `creator_ids` (array of UUIDs), `result_set_id` (string), or `result_set_ids`
        (array). `creator_ids` takes precedence. This endpoint does NOT accept `creators: [{ profile_url }]`.


        **Synchronous completion:** if every requested creator is already enriched, the response is `200` with `jobs_created:
        0` and `all_complete: true` — no job IDs are returned. Otherwise the response is `202`. Enrichment results are retrieved
        via `POST /v1/enrichments/results` using `creator_ids` (there is no per-job polling for enrichment). Costs 1 credit
        per profile enriched.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                creator_ids:
                  type: array
                  items:
                    type: string
                    description: UUID v4 string.
                  description: Creator UUIDs to operate on. Takes precedence over result_set_id / result_set_ids when provided.
                result_set_id:
                  type: string
                  description: A single `result_set_id` returned by a prior discovery search. Resolved to its ranked creators.
                result_set_ids:
                  type: array
                  items:
                    type: string
                  description: Multiple result set IDs to merge (dedupe) into one creator selection.
                top_n:
                  type: integer
                  minimum: 1
                  description: When selecting from result set(s), take only the top N ranked creators.
                ranks:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  description: When a single result_set_id is provided, select specific 1-based ranks (e.g. [1,3,5]).
              example:
                creator_ids:
                - f0e1d2c3-b4a5-4678-9abc-def012345678
                - a1b2c3d4-e5f6-4789-9abc-0123456789ab
      security:
      - bearerAuth: []
      responses:
        '200':
          description: All requested creators were already enriched — no jobs created. Fetch results via POST /v1/enrichments/results
            with creator_ids.
          content:
            application/json:
              schema:
                type: object
                description: All requested creators were already enriched — no jobs created. Fetch results via POST /v1/enrichments/results
                  with creator_ids.
                required:
                - success
                - data
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: true
                    description: Operation payload. See the example for the exact field structure.
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
                example:
                  success: true
                  data:
                    creators_requested: 2
                    selection:
                      source: creator_ids
                      selected_count: 2
                    jobs_created: 0
                    all_complete: true
                    already_enriched_count: 2
                    missing_linkedin_profiles: []
                    jobs: []
                  meta:
                    request_id: req_01HXYZ...
                    trace_id: 4f1d...c2
        '202':
          description: Enrichment queued. Poll results with POST /v1/enrichments/results using the same creator_ids.
          content:
            application/json:
              schema:
                type: object
                description: Enrichment queued. Poll results with POST /v1/enrichments/results using the same creator_ids.
                required:
                - success
                - data
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: true
                    description: Operation payload. See the example for the exact field structure.
                  meta:
                    type: object
                    additionalProperties: true
                    required:
                    - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
                example:
                  success: true
                  data:
                    creators_requested: 2
                    selection:
                      source: creator_ids
                      selected_count: 2
                    jobs_created: 2
                    task_id: run_abc123
                    credits:
                      required: 2
                      deducted: 2
                      remaining: 4998
                    already_enriched_count: 0
                    missing_linkedin_profiles: []
                    jobs:
                    - job_id: enrichment:f0e1d2c3-b4a5-4678-9abc-def012345678
                      creator_id: f0e1d2c3-b4a5-4678-9abc-def012345678
