  /v1/creators/content-match:
    post:
      operationId: startContentMatch
      summary: Start content match analysis
      tags:
      - Analysis
      description: 'Start LinkedIn content-fit analysis for a creator selection. Requires a user-scoped key.


        **Selection (provide exactly one):** `creator_ids`, `result_set_id`, or `result_set_ids`.


        **Topic criteria:** for ad hoc runs (no `campaign_id`) you MUST provide `topic_keywords` (array of strings). The field
        is `topic_keywords`, NOT `topics`. When `campaign_id` is supplied, criteria are read from the campaign instead.


        Returns `202` with **prefixed** job IDs in the form `content-fit:<uuid>` under `data.job_ids` and `data.jobs[].job_id`.
        `jobs_created` is 0 for creators already analyzed. Use those IDs with `POST /v1/content-match/results`. Cost: 3/5/8
        credits per analysis based on `posts_to_analyze` (10/20/30).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                creator_ids:
                  type: array
                  items:
                    type: string
                    description: UUID v4 string.
                  description: Creator UUIDs to operate on. Takes precedence over result_set_id / result_set_ids when provided.
                result_set_id:
                  type: string
                  description: A single `result_set_id` returned by a prior discovery search. Resolved to its ranked creators.
                result_set_ids:
                  type: array
                  items:
                    type: string
                  description: Multiple result set IDs to merge (dedupe) into one creator selection.
                top_n:
