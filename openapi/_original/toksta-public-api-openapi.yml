      summary: Get audience match details
      tags:
      - Analysis
      description: Fetch detailed audience-match breakdowns (top engagers, companies, job titles, geography). Same selection
        model as `/v1/audience-match/results`. `engagers_limit` controls how many engagers are returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                job_id:
                  type: string
