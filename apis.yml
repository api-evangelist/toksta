description: >-
  Toksta is a B2B influencer marketing intelligence platform that uses AI agents
  to research, filter, and match creators at scale for enterprise brands. It
  provides a vetted B2B creator database with LinkedIn and YouTube influencer
  search, automated relevance scoring (AI Match), granular vetting benchmarks
  (Deep Metrics), campaign management, brand monitoring, and reporting. Toksta is
  a portfolio company of Seedcamp. As of this enrichment pass the product is a
  web application (hub.toksta.com) with a marketing site and blog; no public API,
  developer portal, OpenAPI, SDK, or /.well-known discovery surface was found.
