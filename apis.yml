name: toksta
description: >-
  Toksta is a B2B influencer marketing intelligence platform that uses AI agents to
  research, filter, and match creators at scale for enterprise brands. It runs a vetted
  B2B creator database with LinkedIn and YouTube influencer search, automated relevance
  scoring (AI Match), granular vetting benchmarks (Deep Metrics), campaign management,
  brand monitoring, and reporting. Toksta ships two machine surfaces: the Toksta Public
  API v1 at api.toksta.com — a credit-metered REST API with a published OpenAPI 3.0.3
  document and Swagger UI, covering creator search and discovery, enrichment,
  content-match and audience-match analysis jobs, post evidence, campaigns, creator
  lists and account usage — and a hosted, OAuth-protected MCP server at mcp.toksta.com
  exposing 18 tools to Claude and ChatGPT custom connectors. Async work is polling-only;
  there are no webhooks in v1. Toksta is a portfolio company of Seedcamp.
