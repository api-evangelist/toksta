    Hosted remote Model Context Protocol server exposing 18 Toksta tools — campaigns, creator discovery,
    lists, enrichment, content-fit and audience-fit analysis, and job control — to Claude and ChatGPT
    custom connectors. OAuth 2.0 protected resource with RFC 8414 and RFC 9728 discovery metadata. Billed
    against the same credit balance as the REST API; blocked on the Free plan.
