summary: >-
  Published per-minute request ceilings that vary by plan, surfaced at runtime through
  X-RateLimit-* headers and a Retry-After on exhaustion. The rate-limit headers are
  explicitly listed in access-control-expose-headers on every response, including
  anonymous 4xx responses, which is how they were confirmed without a key.
response_headers:
- name: X-RateLimit-Limit
  description: Maximum requests allowed in the current 60-second window.
- name: X-RateLimit-Remaining
  description: Requests left in the current window.
- name: X-RateLimit-Reset
  description: Unix timestamp at which the window resets.
- name: Retry-After
  description: Present on 429 — seconds to wait before it is safe to retry.
exhaustion:
  http_status: 429
  error_code: RATE_LIMITED
  envelope: '{"success":false,"error":{"code":"RATE_LIMITED","message":"..."},"meta":{"request_id":"...","trace_id":"..."}}'
  guidance: Back off per Retry-After. The docs recommend exponential backoff starting ~2s, capped ~30s, for job polling.
